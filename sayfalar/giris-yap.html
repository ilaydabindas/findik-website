<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fındık Dünyası | Üye Ol & Giriş Yap</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container {
            display: flex;
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
            flex-wrap: wrap; 
        }
        .auth-box {
            flex: 1;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            min-width: 300px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="left-spacer"></div>
            <div class="logo">
                <a href="../index.html">FINDIK LOGO / NUTS</a>
            </div>
            <div class="header-icons">
                <a href="giris-yap.html" style="color: #e67e22;" title="Üye Ol/Giriş Yap"><i class="fa-solid fa-user"></i></a>
                <a href="favoriler.html" title="Favoriler"><i class="fa-regular fa-heart"></i></a>
                <a href="sepetim.html" title="Sepetim"><i class="fa-solid fa-bag-shopping"></i></a>
            </div>
        </div>
        <nav class="main-nav" id="mainNav">
            <ul>
                <li><a href="urunler.html">Ürünler</a></li>
                <li><a href="tarifler.html">Tarifler</a></li>
                <li><a href="hakkimizda.html">Hakkımızda</a></li>
                <li><a href="yardim-destek.html">Yardım & Destek</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 40px 5%;">
        <div class="auth-container">
            <div class="auth-box">
                <h2 style="margin-bottom: 20px; color: #2c3e50;">Giriş Yap</h2>
                <form>
                    <div class="form-group">
                        <label for="login-email">E-posta adresi</label>
                        <input type="email" id="login-email" placeholder="E-posta adresiniz">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Şifre</label>
                        <input type="password" id="login-password" placeholder="Şifreniz">
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Giriş Yap</button>
                </form>
            </div>

            <div class="auth-box">
                <h2 style="margin-bottom: 20px; color: #2c3e50;">Yeni Üyelik</h2>
                <form>
                    <a href="kayit-ol.html" class="btn" style="width: 100%; text-align: center; background-color: #27ae60;">Kayıt Ol Sayfasına Git</a>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Fındık Dünyası. Tüm hakları saklıdır.</p>
        </div>
    </footer>
    <script src="../js/main.js"></script>
</body>
</html>
