<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cart_site_title">Bindaş Fındık | Sepetim</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="left-spacer"></div>
            <div class="logo">
                <a href="../index.html">
                    <img src="../images/logo.png" alt="Fındık Dünyası Logo" style="max-height: 80px; width: auto;">
                </a>
            </div>
            <div class="header-icons">
                <!-- Dil Değiştirme Butonları (Eklendi) -->
                <div class="lang-switcher" style="display: inline-block; margin-right: 15px;">
                    <button id="btn-tr" style="background:none; border:none; cursor:pointer; font-weight:bold;">TR</button> | 
                    <button id="btn-en" style="background:none; border:none; cursor:pointer; color:#777;">EN</button>
                </div>
                <a href="giris-yap.html" title="Üye Ol/Giriş Yap"><i class="fa-regular fa-user"></i></a>
                <a href="favoriler.html" title="Favoriler"><i class="fa-regular fa-heart"></i></a>
                <a href="sepetim.html" title="Sepetim" style="color: #e67e22;"><i class="fa-solid fa-bag-shopping"></i></a>
            </div>
        </div>
        <nav class="main-nav" id="mainNav">
            <ul>
                <li><a href="urunler.html" data-i18n="nav_products">Ürünler</a></li>
                <li><a href="tarifler.html" data-i18n="nav_recipes">Tarifler</a></li>
                <li><a href="hakkimizda.html" data-i18n="nav_about">Hakkımızda</a></li>
                <li><a href="yardim-destek.html" data-i18n="nav_support">Yardım & Destek</a></li>
            </ul>
        </nav>
    </header>

    <main class="cart-page">
        <div class="cart-container">
            <h2 data-i18n="cart_main_title">SEPETİM</h2>
            
            <table class="cart-table">
                <thead>
                    <tr>
                        <th data-i18n="th_product_name">Ürün Adı</th>
                        <th data-i18n="th_price">Fiyat</th>
                        <th data-i18n="th_quantity">Ürün Adedi</th>
                        <th data-i18n="th_remove">Kaldır</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

            <div class="cart-summary">
                <h3 class="total-price">
                    <span data-i18n="total_price_label">Toplam Fiyat</span> :
                    <span id="cart-total">0 TL</span>
                </h3>
                <button class="checkout-btn" data-i18n="checkout_btn">Ödemeye geç</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Birtaş Gıda Tarım Ürünleri LTD. ŞTİ.</p>
        </div>
    </footer>

    <script defer src="../js/main.js"></script>
</body>
</html>
